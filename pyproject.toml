[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revive"
version = "0.1.0"
description = "PAYVANTA — Autonomous Revenue Recovery Intelligence (Razorpay Buildathon Track 03)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
revive = "revive.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["revive*"]

[tool.setuptools.package-data]
revive = ["product/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
